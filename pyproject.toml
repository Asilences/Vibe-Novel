[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vibenovel"
version = "3.0.0a4"
description = "Local-first novel workspace and author-controlled Studio"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
studio = ["fastapi>=0.115,<0.129", "uvicorn>=0.30,<0.35"]
test = ["httpx>=0.27,<0.29"]

[project.scripts]
vibenovel = "vibenovel.cli:main"
vibenovel-studio = "vibenovel.studio.server:main"

[tool.setuptools.packages.find]
where = ["src"]
