[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vibenovel"
version = "3.0.0a9"
description = "Local-first novel workspace and author-controlled Studio"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
studio = ["fastapi>=0.115,<0.129", "uvicorn>=0.30,<0.35"]
test = ["httpx>=0.27,<0.29"]
semantic = ["onnxruntime==1.20.1", "tokenizers>=0.20,<1", "numpy>=1.24,<2; python_version<'3.13'", "numpy>=2.1,<3; python_version>='3.13'"]

[project.scripts]
vibenovel = "vibenovel.cli:main"
vibenovel-studio = "vibenovel.studio.server:main"

[tool.setuptools.packages.find]
where = ["src"]
